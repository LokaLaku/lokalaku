name: Website Optimization CI

on:
  push:
    branches:
      - main

jobs:
  optimize-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Langkah 1: Checkout kode dari repositori
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Langkah 2: Minify HTML, CSS, dan JavaScript (MENGGUNAKAN ACTION BARU)
      - name: Minify Website Assets
        uses: actions-minify/actions-minify@v3

      # Langkah 3: Kompresi Gambar (MENGGUNAKAN ACTION BARU)
      # Action ini akan mencari semua gambar, mengompresnya, dan membuat commit baru.
      # Action ini secara otomatis menangani konversi ke WebP jika memungkinkan
      # dan juga menghapus file asli jika sudah ada versi .webp nya.
      - name: Compress Images
        uses: calibreapp/image-actions@v1.1.0
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: true # Hanya kompresi, tidak membuat Pull Request

      # Langkah 4: Commit perubahan kembali ke repositori (jika ada)
      # Langkah ini sekarang ditangani oleh action calibreapp/image-actions dan actions-minify
      # namun kita bisa tambahkan langkah commit manual untuk memastikan semua perubahan ter-commit
      - name: Commit Optimized Files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Optimize website assets (minify, compress images)" -a
            git push
          else
            echo "No new changes to commit."
          fi
        shell: bash
