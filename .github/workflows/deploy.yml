name: Build & Deploy to GitHub Pages and Vercel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install CLI tools
      - name: Install dependencies
        run: npm install -g terser csso-cli cwebp

      # 4️⃣ Minify CSS
      - name: Minify CSS
        run: |
          find . -type f -name "*.css" ! -name "*.min.css" | while read css; do
            csso "$css" --output "${css%.css}.min.css"
          done

      # 5️⃣ Minify JS
      - name: Minify JS
        run: |
          find . -type f -name "*.js" ! -name "*.min.js" | while read js; do
            terser "$js" -o "${js%.js}.min.js" -c -m
          done

      # 6️⃣ Convert JPG/PNG to WebP
      - name: Convert images to WebP
        run: |
          find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read img; do
            cwebp -q 80 "$img" -o "${img%.*}.webp"
          done

      # 7️⃣ Save build output (artifacts) for deploy jobs
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name
