name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install CLI tools (CSS, JS, HTML minifier)
      - name: Install dependencies
        run: |
          npm install -g terser csso-cli html-minifier-terser

      # 4️⃣ Minify CSS
      - name: Minify CSS
        run: |
          find . -type f -name "*.css" ! -name "*.min.css" | while read css; do
            csso "$css" --output "${css%.css}.min.css"
          done

      # 5️⃣ Minify JS
      - name: Minify JS
        run: |
          find . -type f -name "*.js" ! -name "*.min.js" | while read js; do
            terser "$js" -o "${js%.js}.min.js" -c -m
          done

      # 6️⃣ Minify HTML (Safe Mode)
      - name: Minify HTML
        run: |
          find . -type f -name "*.html" | while read html; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              --ignore-custom-comments "^\[if|^\/|^google|^\/google" \
              -o "$html" "$html"
          done

      # 7️⃣ Cek & Install cwebp, Kompres gambar → WebP
      - name: Check & Install cwebp, Compress Images
        run: |
          if ! command -v cwebp &> /dev/null; then
            echo "cwebp not found, installing..."
            sudo apt-get update && sudo apt-get install -y webp
          else
            echo "cwebp already installed: $(cwebp -version)"
          fi
          echo "Starting image compression..."
          find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) -print0 | \
          while IFS= read -r -d '' img; do
            echo "Converting: $img"
            if cwebp -q 80 "$img" -o "${img%.*}.webp"; then
              rm "$img"
              echo "✅ Converted and removed original: $img"
            else
              echo "❌ Failed to convert: $img"
            fi
          done

      # 8️⃣ Upload artifacts untuk deploy
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: .

  deploy_github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: .
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
