name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install CLI tools (CSS, JS, HTML minifier)
      - name: Install dependencies
        run: |
          npm install -g terser csso-cli html-minifier-terser

      # 4️⃣ Copy semua file ke folder dist/
      - name: Prepare dist folder
        run: |
          mkdir dist
          cp -r * dist/
          rm -rf dist/.github   # hapus folder workflow biar ga ikut terpublish

      # 5️⃣ Minify CSS
      - name: Minify CSS
        run: |
          find dist -type f -name "*.css" ! -name "*.min.css" | while read css; do
            csso "$css" --output "$css"
          done

      # 6️⃣ Minify JS
      - name: Minify JS
        run: |
          find dist -type f -name "*.js" ! -name "*.min.js" | while read js; do
            terser "$js" -o "$js" -c -m
          done

      # 7️⃣ Minify HTML
      - name: Minify HTML
        run: |
          find dist -type f -name "*.html" | while read html; do
            html-minifier-terser \
              --collapse-whitespace \
              --remove-comments \
              --remove-redundant-attributes \
              --remove-script-type-attributes \
              --remove-style-link-type-attributes \
              --use-short-doctype \
              --minify-css true \
              --minify-js true \
              --ignore-custom-comments "^\[if|^\/|^google|^\/google" \
              -o "$html" "$html"
          done

      # 8️⃣ Kompres gambar ke WebP TANPA menghapus aslinya
      - name: Compress Images to WebP (keep originals)
        run: |
          if ! command -v cwebp &> /dev/null; then
            sudo apt-get update && sudo apt-get install -y webp
          fi
          find dist -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read img; do
            cwebp -q 80 "$img" -o "${img%.*}.webp" || true
          done

      # 9️⃣ Upload artifacts untuk deploy
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: dist

  deploy_github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: dist
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
