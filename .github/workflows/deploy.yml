name: Build & Deploy to GitHub Pages and Vercel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install dependencies (opsional, hanya jika perlu)
      - name: Install dependencies
        run: npm install -g terser csso-cli cwebp

      # 4️⃣ Minify CSS
      - name: Minify CSS
        run: |
          find . -type f -name "*.css" ! -name "*.min.css" | while read css; do
            csso "$css" --output "${css%.css}.min.css"
          done

      # 5️⃣ Minify JS
      - name: Minify JS
        run: |
          find . -type f -name "*.js" ! -name "*.min.js" | while read js; do
            terser "$js" -o "${js%.js}.min.js" -c -m
          done

      # 6️⃣ Convert JPG/PNG to WebP
      - name: Convert images to WebP
        run: |
          find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \) | while read img; do
            cwebp -q 80 "$img" -o "${img%.*}.webp"
          done

  deploy_github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true

  deploy_vercel:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Deploy to Vercel
        run: |
          npm install -g vercel
          vercel --token=${{ secrets.VERCEL_TOKEN }} --prod --confirm
