name: Build & Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3️⃣ Install CLI tools & libwebp
      - name: Install dependencies
        run: |
          npm install -g terser csso-cli
          sudo apt-get update && sudo apt-get install -y webp

      # 4️⃣ Minify CSS
      - name: Minify CSS
        run: |
          find . -type f -name "*.css" ! -name "*.min.css" | while read css; do
            csso "$css" --output "${css%.css}.min.css"
          done

      # 5️⃣ Minify JS
      - name: Minify JS
        run: |
          find . -type f -name "*.js" ! -name "*.min.js" | while read js; do
            terser "$js" -o "${js%.js}.min.js" -c -m
          done

      # 6️⃣ Convert JPG/PNG to WebP & hapus file asli
      - name: Convert images to WebP and remove originals
        run: |
          shopt -s nullglob
          imgs=( $(find . -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" \)) )
          if [ ${#imgs[@]} -eq 0 ]; then
            echo "No JPG/PNG files found. Skipping conversion."
          else
            for img in "${imgs[@]}"; do
              echo "Converting: $img"
              cwebp -q 80 "$img" -o "${img%.*}.webp" && rm "$img"
            done
          fi

      # 7️⃣ Upload artifacts untuk deploy
      - name: Upload build files
        uses: actions/upload-artifact@v4
        with:
          name: site-files
          path: .

  deploy_github:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build files
        uses: actions/download-artifact@v4
        with:
          name: site-files
          path: .
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          force_orphan: true
