<!DOCTYPE html>
<html lang="en">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width,initial-scale=1">
      <!-- Icons -->
      <link href="/favicon.webp" rel="icon" type="image/webp"/>
      <link href="/apple-touch-icon.png" rel="apple-touch-icon"/>
      <title>Thank You - LokaLaku Trip</title>
      <link rel="stylesheet" href="css/bootstrap.min.css">
      <link rel="stylesheet" href="css/style.css">
      <style>
         body {
            background:#f5f5f5;
            font-family:'Source Sans Pro',sans-serif;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            text-align:center;
            padding:20px
         }
         .thank-you-box {
            background:#fff;
            padding:40px 30px;
            border-radius:12px;
            box-shadow:0 4px 20px rgba(0,0,0,.1);
            max-width:600px;
            width:100%
         }
         .thank-you-box img.logo {
            max-width:160px;
            margin-bottom:25px
         }
         .thank-you-box h1 {
            font-size:2em;
            color:#28a745;
            margin-bottom:20px
         }
         .thank-you-box p {
            font-size:1.1em;
            color:#333
         }
         .thank-you-box a {
            margin-top:20px;
            display:inline-block
         }
         .carousel-inner img {
            border-radius:12px;
            height:250px;
            object-fit:cover;
         }
      </style>
   </head>
   <body>
      <div class="thank-you-box">
         
         <!-- Slideshow otomatis -->
         <div id="thankYouCarousel" class="carousel slide mb-4" data-bs-ride="carousel" data-bs-interval="3000">
            <div class="carousel-inner">
               <div class="carousel-item active">
                  <img src="images/slide1.webp" class="d-block w-100" alt="Slide 1">
               </div>
               <div class="carousel-item">
                  <img src="images/slide2.webp" class="d-block w-100" alt="Slide 2">
               </div>
               <div class="carousel-item">
                  <img src="images/slide3.webp" class="d-block w-100" alt="Slide 3">
               </div>
            </div>
         </div>

         <!-- Logo & Text -->
         <img src="images/logo.webp" alt="LokaLaku Logo" class="logo">
         <h1>Thank You! 🙏</h1>
         <p>Your message has been successfully sent.<br>We'll get back to you as soon as possible.</p>
         <a href="index.html" class="btn btn-success">Back to Homepage</a>
      </div>

      <!-- Bootstrap JS -->
      <script src="js/bootstrap.bundle.min.js"></script>
   </body>
</html>
