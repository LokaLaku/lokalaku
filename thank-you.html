<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- Icons -->
  <link href="/favicon.webp" rel="icon" type="image/webp" />
  <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
  <title>Thank You - LokaLaku Trip</title>

  <!-- Bootstrap CSS via CDN -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Style kamu -->
  <link rel="stylesheet" href="css/style.css" />

  <style>
    body {
      background:#f5f5f5;
      font-family:'Source Sans Pro',sans-serif;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
      text-align:center;
      padding:20px
    }
    .thank-you-box {
      background:#fff;
      padding:40px 30px;
      border-radius:12px;
      box-shadow:0 4px 20px rgba(0,0,0,.1);
      max-width:600px;
      width:100%;
      overflow:hidden;
    }
    .thank-you-box img.logo {
      max-width:160px;
      margin-bottom:20px; /* jarak dengan slideshow */
    }
    .thank-you-box h1 {
      font-size:2em;
      color:#28a745;
      margin-bottom:20px
    }
    .thank-you-box p {
      font-size:1.1em;
      color:#333
    }
    .thank-you-box a {
      margin-top:20px;
      display:inline-block
    }

    /* Slideshow penuh kotak */
    .carousel-inner {
      width:100%;
      height:300px; /* tinggi slide */
    }
    .carousel-inner img {
      width:100%;
      height:100%;
      object-fit:cover;
      border-radius:12px;
    }

    /* Fade lebih halus */
    .carousel-fade .carousel-item {
      transition: opacity 1.2s ease-in-out;
    }

    /* Efek zoom (Ken Burns) */
    .carousel-item img {
      animation: zoomEffect 6s ease-in-out infinite;
    }
    @keyframes zoomEffect {
      0%   { transform: scale(1); }
      100% { transform: scale(1.1); }
    }
  </style>
</head>
<body>
  <div class="thank-you-box">
    <!-- Logo di atas -->
    <img src="images/logo-header.webp" alt="LokaLaku Logo" class="logo">

    <div id="thankYouCarousel" class="carousel slide carousel-fad
